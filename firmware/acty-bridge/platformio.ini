; Acty HU signal bridge — ESP32-S3 firmware.
; Build:  pio run          Upload: pio run -t upload        Serial: pio device monitor

[env:esp32-s3-devkitc-1]
platform = espressif32@6.9.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
build_flags =
    ; Use the S3's native USB port as the serial port, so the tablet sees a standard CDC device.
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
