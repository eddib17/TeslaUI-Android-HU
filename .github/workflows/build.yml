# Builds, checks and packages the Android app and the bridge firmware on every push and pull request.
# Download the results from the run's "Artifacts" section (see README "How to install the APK").
name: Build

on:
  push:
  pull_request:
  workflow_dispatch: # lets the owner re-run it from the Actions tab

# A newer push to the same branch cancels the older, now-pointless run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Check formatting
        run: ./gradlew spotlessCheck
      - name: Unit tests
        run: ./gradlew testDebugUnitTest
      - name: Android lint
        run: ./gradlew lintDebug
      - name: Build debug APK
        run: ./gradlew assembleDebug
      - name: Rename APK
        # Gives the file a name that says which build it is, e.g. acty-hu-42-1a2b3c4.apk
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk "dist/acty-hu-${GITHUB_RUN_NUMBER}-${GITHUB_SHA::7}.apk"
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: acty-hu-apk
          path: dist/*.apk
          retention-days: 30
      - name: Upload test and lint reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-reports
          path: |
            app/build/reports/
            app/build/test-results/
          retention-days: 14

  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ hashFiles('firmware/acty-bridge/platformio.ini') }}
      - name: Install PlatformIO
        run: pip install platformio
      - name: Build firmware
        run: pio run -d firmware/acty-bridge
      - name: Collect firmware files
        # firmware.bin alone is enough for `pio run -t upload`; bootloader + partitions are kept for flashing tools.
        run: |
          mkdir -p dist
          cp firmware/acty-bridge/.pio/build/esp32-s3-devkitc-1/{firmware,bootloader,partitions}.bin dist/
      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: acty-bridge-firmware
          path: dist/*.bin
          retention-days: 30
